<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; worker-src blob:; connect-src 'self' https://cdn.jsdelivr.net https://cdn.sheetjs.com https://tessdata.projectnaptha.com https://raw.githubusercontent.com">
<title>TableShot Pro - استخراج الجداول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#64748b; --accent:#2563eb; --danger:#dc2626; --border:#e2e8f0; --radius:12px; }
  * { box-sizing:border-box; font-family:'Cairo',sans-serif; }
  body { margin:0; background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--border); padding:16px 24px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
  header h1 { margin:0; font-size:24px; color:var(--accent); }
  main { max-width:1100px; margin:30px auto; padding:0 20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:24px; box-shadow:0 4px 6px -1px rgba(0,0,0,.05); }
  .drop-zone { border:2px dashed #cbd5e1; border-radius:var(--radius); padding:40px 20px; text-align:center; cursor:pointer; background:#f8fafc; }
  .drop-zone:hover, .drop-zone:focus-visible, .drop-zone.over { border-color:var(--accent); background:#eff6ff; outline:none; }
  .drop-zone strong { display:block; font-size:18px; margin-bottom:8px; }
  .hint { font-size:13px; color:var(--muted); }
  .controls { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; margin-top:20px; }
  .form-group { display:flex; flex-direction:column; gap:6px; flex:1; min-width:150px; }
  .form-group label { font-size:14px; font-weight:600; }
  select { padding:10px; border-radius:8px; border:1px solid var(--border); font-size:14px; width:100%; }
  button { padding:12px 24px; border-radius:8px; border:none; font-weight:600; font-size:15px; cursor:pointer; display:inline-flex; justify-content:center; align-items:center; transition:.2s; }
  button.primary { background:var(--accent); color:#fff; }
  button.primary:hover:not(:disabled) { background:#1d4ed8; }
  button.success { background:#059669; color:#fff; }
  button.success:hover:not(:disabled) { background:#047857; }
  button.secondary { background:#e2e8f0; color:var(--ink); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #preview { max-width:100%; max-height:250px; border-radius:8px; margin-top:20px; display:none; border:1px solid var(--border); }
  .progress-bar { height:8px; background:#e2e8f0; border-radius:4px; overflow:hidden; margin-top:16px; display:none; }
  .progress-fill { height:100%; width:0%; background:var(--accent); transition:width .2s; }
  #status { margin-top:12px; font-size:14px; font-weight:600; color:var(--muted); text-align:center; }
  .table-container { overflow-x:auto; margin-top:16px; border-radius:8px; border:1px solid var(--border); display:none; max-height:500px; }
  table { border-collapse:collapse; width:100%; background:#fff; }
  td { border:1px solid var(--border); padding:10px 12px; min-width:80px; font-size:14px; outline:none; background:#fffbeb; color:#000; }
  tr:first-child td { background:#f1f5f9; font-weight:700; }
  td:focus { background:#eff6ff; box-shadow:inset 0 0 0 2px var(--accent); }
  .editor-toolbar { display:none; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .checkbox-label { display:flex; align-items:center; gap:8px; font-size:14px; margin-top:10px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <h1>TableShot Pro</h1>
  <span>نسخة محسنة</span>
</header>

<main>
  <section class="card">
    <div id="drop" class="drop-zone" role="button" tabindex="0" aria-label="اختيار صورة الجدول">
      <strong>اسحب صورة الجدول هنا أو انقر للاختيار</strong>
      <span class="hint">الحد الأقصى 15 ميغابايت — تتم المعالجة على جهازك ولا تُرفع الصورة</span>
      <input id="file" type="file" accept="image/*" hidden>
    </div>
    <img id="preview" alt="معاينة الصورة">

    <div class="controls">
      <div class="form-group">
        <label for="lang">لغة النص:</label>
        <select id="lang">
          <option value="ara+fra+eng" selected>عربي + فرنسي + إنجليزي</option>
          <option value="ara">العربية فقط</option>
          <option value="fra">الفرنسية فقط</option>
          <option value="eng">الإنجليزية فقط</option>
          <option value="spa">الإسبانية</option>
          <option value="deu">الألمانية</option>
          <option value="tur">التركية</option>
          <option value="ita">الإيطالية</option>
          <option value="por">البرتغالية</option>
          <option value="rus">الروسية</option>
          <option value="chi_sim">الصينية</option>
          <option value="jpn">اليابانية</option>
        </select>
      </div>
      <div class="form-group">
        <label for="rtl">اتجاه الأعمدة:</label>
        <select id="rtl">
          <option value="true" selected>من اليمين لليسار (RTL)</option>
          <option value="false">من اليسار لليمين (LTR)</option>
        </select>
      </div>
    </div>

    <div style="display:flex; gap:20px; margin-top:15px; flex-wrap:wrap;">
      <label class="checkbox-label">
        <input type="checkbox" id="chkThreshold" checked>
        تحسين الصورة (أبيض وأسود تلقائي)
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkHighRes">
        دقة عالية (أبطأ قليلاً)
      </label>
    </div>

    <div style="margin-top:20px; display:flex; gap:10px;">
      <button id="run" class="primary" disabled style="flex:1;">استخراج الجدول</button>
      <button id="download" class="success" disabled style="flex:1;">تنزيل Excel (xlsx)</button>
    </div>

    <div class="progress-bar" id="bar"><div class="progress-fill" id="barFill"></div></div>
    <div id="status" role="status" aria-live="polite">الرجاء اختيار صورة للبدء.</div>
  </section>

  <section class="card" id="editorCard" style="display:none;">
    <div class="editor-toolbar" id="toolbar">
      <button class="secondary" id="btnTranspose">تدوير الجدول</button>
      <button class="secondary" id="btnRemoveEmpty">حذف الأعمدة الفارغة</button>
      <span class="hint" style="align-self:center;">💡 انقر على أي خلية لتصحيحها</span>
    </div>
    <div class="table-container" id="tableContainer">
      <table id="resultTable"></table>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
(() => {
  "use strict";

  const MAX_BYTES = 15 * 1024 * 1024;
  const MIN_CONFIDENCE = 20;

  const $ = (id) => document.getElementById(id);
  const dropZone = $("drop"), fileInput = $("file"), preview = $("preview");
  const runBtn = $("run"), dlBtn = $("download"), statusEl = $("status");
  const bar = $("bar"), barFill = $("barFill");
  const tableContainer = $("tableContainer"), resultTable = $("resultTable");
  const toolbar = $("toolbar"), editorCard = $("editorCard");

  let imageFile = null, previewUrl = null, grid = [], worker = null, workerLang = null, busy = false;

  /* ---------- أحداث الإدخال ---------- */
  dropZone.addEventListener("click", () => fileInput.click());
  dropZone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
  });
  dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("over"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("over"));
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault(); dropZone.classList.remove("over");
    if (e.dataTransfer.files[0]) setImage(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change", () => { if (fileInput.files[0]) setImage(fileInput.files[0]); });
  runBtn.addEventListener("click", runOCR);
  dlBtn.addEventListener("click", downloadFile);
  $("btnTranspose").addEventListener("click", transposeTable);
  $("btnRemoveEmpty").addEventListener("click", () => {
    removeEmptyColumns();
    renderTable();
    setStatus("تم حذف الأعمدة الفارغة.");
  });

  function setImage(file) {
    if (!file.type.startsWith("image/")) return setStatus("الملف ليس صورة صالحة.", true);
    if (file.size > MAX_BYTES) return setStatus("الملف كبير جداً (الحد 15 ميغابايت).", true);

    imageFile = file;
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(file);
    preview.src = previewUrl;
    preview.style.display = "block";
    runBtn.disabled = false;
    dlBtn.disabled = true;
    editorCard.style.display = "none";
    setStatus("الصورة جاهزة. اضغط استخراج الجدول.");
  }

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.style.color = isError ? "var(--danger)" : "var(--muted)";
  }

  /* ---------- معالجة الصورة ---------- */
  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("تعذر فتح الصورة.")); };
      img.src = url;
    });
  }

  // Otsu: يحسب عتبة الأبيض/الأسود تلقائياً
  function otsuThreshold(hist, total) {
    let sum = 0;
    for (let t = 0; t < 256; t++) sum += t * hist[t];
    let sumB = 0, wB = 0, maxVar = 0, threshold = 127;
    for (let t = 0; t < 256; t++) {
      wB += hist[t];
      if (wB === 0) continue;
      const wF = total - wB;
      if (wF === 0) break;
      sumB += t * hist[t];
      const mB = sumB / wB, mF = (sum - sumB) / wF;
      const between = wB * wF * (mB - mF) ** 2;
      if (between > maxVar) { maxVar = between; threshold = t; }
    }
    return threshold;
  }

  function binarize(ctx, w, h) {
    const imageData = ctx.getImageData(0, 0, w, h);
    const d = imageData.data;
    const gray = new Uint8ClampedArray(w * h);
    const hist = new Array(256).fill(0);
    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
      const g = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) | 0;
      gray[p] = g; hist[g]++;
    }
    const t = otsuThreshold(hist, w * h);
    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
      const v = gray[p] > t ? 255 : 0;
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    ctx.putImageData(imageData, 0, 0);
  }

  async function preprocessImage(file) {
    const img = await loadImage(file);
    const maxW = $("chkHighRes").checked ? 3000 : 2000;
    const scale = Math.min(1, maxW / img.width);
    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);

    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.fillStyle = "#fff";            // خلفية بيضاء للصور الشفافة
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);

    if ($("chkThreshold").checked) binarize(ctx, w, h);

    return new Promise((resolve, reject) =>
      canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("فشل تجهيز الصورة"))), "image/png")
    );
  }

  /* ---------- OCR ---------- */
  async function getWorker(lang) {
    if (worker && workerLang === lang) return worker;
    if (worker) { await worker.terminate(); worker = null; }
    setStatus("جاري تحميل محرك اللغة...");
    worker = await Tesseract.createWorker(lang, 1, {
      logger: (m) => {
        if (m.status === "recognizing text") {
          const pct = Math.round(m.progress * 100);
          barFill.style.width = pct + "%";
          setStatus("جاري القراءة... " + pct + "%");
        }
      },
    });
    await worker.setParameters({ tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT });
    workerLang = lang;
    return worker;
  }

  async function runOCR() {
    if (!imageFile || busy) return;
    if (typeof Tesseract === "undefined") return setStatus("تعذر تحميل مكتبة OCR. تحقق من الاتصال.", true);

    busy = true;
    runBtn.disabled = true; dlBtn.disabled = true;
    bar.style.display = "block"; barFill.style.width = "0%";
    editorCard.style.display = "none";

    try {
      setStatus("تجهيز الصورة...");
      const blob = await preprocessImage(imageFile);
      const w = await getWorker($("lang").value);
      const { data } = await w.recognize(blob);

      const words = (data.words || []).filter(x => x.text.trim() && x.confidence > MIN_CONFIDENCE);
      if (!words.length) throw new Error("لم يتم العثور على نص واضح.");

      grid = buildGrid(words, $("rtl").value === "true");
      if (!grid.length) throw new Error("تعذر بناء الجدول من النص المستخرج.");
      removeEmptyColumns();

      renderTable();
      editorCard.style.display = "block";
      toolbar.style.display = "flex";
      tableContainer.style.display = "block";
      dlBtn.disabled = false;
      setStatus(`تم استخراج ${grid.length} صف. راجع الخلايا قبل التنزيل.`);
    } catch (err) {
      console.error(err);
      setStatus("خطأ: " + err.message, true);
    } finally {
      bar.style.display = "none";
      runBtn.disabled = false;
      busy = false;
    }
  }

  /* ---------- بناء الجدول ---------- */
  function buildGrid(words, reverseColumns) {
    const heights = words.map(w => w.bbox.y1 - w.bbox.y0).sort((a, b) => a - b);
    const medH = heights[Math.floor(heights.length / 2)] || 15;

    // تجميع الكلمات في صفوف حسب الإحداثي الرأسي
    const sorted = [...words].sort((a, b) => ((a.bbox.y0 + a.bbox.y1) / 2) - ((b.bbox.y0 + b.bbox.y1) / 2));
    const rows = [];
    for (const w of sorted) {
      const cy = (w.bbox.y0 + w.bbox.y1) / 2;
      const last = rows[rows.length - 1];
      if (last && Math.abs(cy - last.cy) < medH * 0.6) {
        last.words.push(w);
        last.cy = last.words.reduce((s, x) => s + (x.bbox.y0 + x.bbox.y1) / 2, 0) / last.words.length;
      } else {
        rows.push({ cy, words: [w] });
      }
    }

    // دمج الكلمات القريبة أفقياً في خلية واحدة
    const gapThreshold = medH * 1.2;
    const cellsPerRow = rows.map(r => {
      const ws = [...r.words].sort((a, b) => a.bbox.x0 - b.bbox.x0);
      const cells = [];
      for (const w of ws) {
        const last = cells[cells.length - 1];
        if (last && w.bbox.x0 - last.x1 < gapThreshold) {
          last.text += " " + w.text.trim();
          last.x1 = Math.max(last.x1, w.bbox.x1);
          last.cx = (last.x0 + last.x1) / 2;
        } else {
          cells.push({ text: w.text.trim(), x0: w.bbox.x0, x1: w.bbox.x1, cx: (w.bbox.x0 + w.bbox.x1) / 2 });
        }
      }
      return cells;
    });

    // أعمدة مرجعية من مراكز الخلايا
    const allCenters = cellsPerRow.flat().map(c => c.cx).sort((a, b) => a - b);
    const anchors = [];
    const tol = medH * 2.5;
    for (const x of allCenters) {
      const last = anchors[anchors.length - 1];
      if (last !== undefined && Math.abs(x - last) < tol) continue;
      anchors.push(x);
    }
    if (!anchors.length) return [];

    const out = cellsPerRow.map(cells => {
      const row = new Array(anchors.length).fill("");
      for (const c of cells) {
        let best = 0, bestD = Infinity;
        anchors.forEach((a, i) => {
          const d = Math.abs(a - c.cx);
          if (d < bestD) { bestD = d; best = i; }
        });
        row[best] = row[best] ? row[best] + " " + c.text : c.text;
      }
      return row;
    });

    let cleaned = out.filter(r => r.some(v => v !== ""));
    if (reverseColumns) cleaned = cleaned.map(r => [...r].reverse());
    return cleaned;
  }

  // يحذف فقط الأعمدة الفارغة كلياً (بدون فقدان بيانات حقيقية)
  function removeEmptyColumns() {
    if (!grid.length) return;
    const n = Math.max(...grid.map(r => r.length));
    const keep = [];
    for (let c = 0; c < n; c++) {
      if (grid.some(r => (r[c] || "").trim() !== "")) keep.push(c);
    }
    grid = grid.map(r => keep.map(c => r[c] || ""));
  }

  function transposeTable() {
    if (!grid.length) return;
    const n = Math.max(...grid.map(r => r.length));
    grid = Array.from({ length: n }, (_, c) => grid.map(r => r[c] || ""));
    renderTable();
  }

  /* ---------- عرض المحرر ---------- */
  function renderTable() {
    resultTable.textContent = "";
    grid.forEach((row, ri) => {
      const tr = document.createElement("tr");
      row.forEach((val, ci) => {
        const td = document.createElement("td");
        td.contentEditable = "true";
        td.textContent = val;
        td.addEventListener("input", () => { grid[ri][ci] = td.textContent; });
        // لصق نص عادي فقط
        td.addEventListener("paste", (e) => {
          e.preventDefault();
          document.execCommand("insertText", false, e.clipboardData.getData("text/plain"));
        });
        tr.appendChild(td);
      });
      resultTable.appendChild(tr);
    });
  }

  /* ---------- التنزيل ---------- */
  // يمنع تنفيذ الصيغ في Excel عند فتح ملف CSV
  function csvSafe(v) {
    const s = String(v ?? "");
    return /^[=+\-@\t\r]/.test(s) ? "'" + s : s;
  }

  function downloadFile() {
    if (!grid.length) return;

    if (typeof XLSX !== "undefined") {
      try {
        const ws = XLSX.utils.aoa_to_sheet(grid);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Table");
        XLSX.writeFile(wb, "table_extracted.xlsx");
        return setStatus("تم تنزيل الملف بنجاح!");
      } catch (e) {
        console.error(e);
      }
    }

    // خطة بديلة: CSV مع حماية من حقن الصيغ
    try {
      const csv = grid
        .map(r => r.map(v => '"' + csvSafe(v).replace(/"/g, '""') + '"').join(","))
        .join("\r\n");
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "table_extracted.csv";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setStatus("تم التنزيل بصيغة CSV (بديلة).");
    } catch (err) {
      console.error(err);
      setStatus("فشل التنزيل. جرب متصفحاً آخر.", true);
    }
  }
})();
</script>
</body>
</html>
